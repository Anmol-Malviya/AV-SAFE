# AV-SAFE ML Pipeline Configuration
project_name: "AV-SAFE Phishing URL Detection"
version: "2.0.0"
random_seed: 42

dataset:
  raw_path: "datasets/PhiUSIIL_Phishing_URL_Dataset.csv"
  processed_path: "datasets/processed/phishing_dataset_processed.parquet"
  processed_csv_path: "datasets/processed/phishing_dataset_processed.csv"
  splits_dir: "datasets/splits"
  url_column: "URL"
  target_column: "label"
  domain_column: "Domain"

splitting:
  strategy: "domain_grouped" # Domain-grouped splitting prevents data leakage between train and test
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  shuffle: true

features:
  pipeline_type: "url_only" # "url_only" (offline 24 signals) or "website_dependent"
  normalize: true
  scaler_type: "standard" # mean and standard deviation standardization

training:
  models_dir: "models/trained"
  checkpoints_dir: "models/checkpoints"
  algorithms:
    - sgd
    - random_forest
    - xgboost
    - lightgbm

  sgd:
    loss: "log_loss" # Logistic regression
    penalty: "l2"
    alpha: 0.0001
    max_iter: 2000
    tol: 1e-4
    class_weight: "balanced"
    early_stopping: true

  random_forest:
    n_estimators: 150
    max_depth: 16
    min_samples_split: 5
    min_samples_leaf: 2
    n_jobs: -1
    class_weight: "balanced"

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    eval_metric: "logloss"

  lightgbm:
    n_estimators: 250
    max_depth: 8
    num_leaves: 31
    learning_rate: 0.06
    subsample: 0.8
    colsample_bytree: 0.8
    objective: "binary"
    verbose: -1

evaluation:
  reports_dir: "reports"
  threshold: 0.50
  prioritize_metric: "f1"
  max_fpr: 0.03 # False positive rate limit for production consideration

export:
  target_json_path: "models/exported/phishing_model_weights.json"
  backup_json_path: "models/exported/phishing_model_weights_backup.json"
  exported_dir: "models/exported"
  metadata_dir: "models/metadata"
