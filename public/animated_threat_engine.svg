<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.6s linear infinite;
      }
      .threat-line {
        stroke-dasharray: 6, 6;
        animation: dashThreat 1.2s linear infinite;
      }
      .pulse-circle {
        animation: radarPulse 2s ease-in-out infinite;
      }
      .badge-glow {
        animation: neonPulse 2s ease-in-out infinite alternate;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashThreat {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes radarPulse {
        0% { r: 5; opacity: 1; }
        100% { r: 16; opacity: 0; }
      }
      @keyframes neonPulse {
        0% { opacity: 0.85; filter: drop-shadow(0 0 2px #38BDF8); }
        100% { opacity: 1; filter: drop-shadow(0 0 10px #38BDF8); }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.12">
    <path d="M 0 60 H 960 M 0 120 H 960 M 0 180 H 960 M 0 240 H 960 M 0 300 H 960" stroke="#94A3B8" stroke-width="1" />
    <path d="M 160 0 V 380 M 320 0 V 380 M 480 0 V 380 M 640 0 V 380 M 800 0 V 380" stroke="#94A3B8" stroke-width="1" />
  </g>

  <!-- Flow Paths / Connecting Wires -->
  <!-- Web to Engine -->
  <path d="M 230 110 C 310 110, 310 190, 380 190" fill="none" stroke="#38BDF8" stroke-width="2.5" class="flow-line" />
  <!-- Extension to Engine -->
  <path d="M 230 190 L 380 190" fill="none" stroke="#60A5FA" stroke-width="3" class="flow-line" />
  <!-- Android to Engine -->
  <path d="M 230 270 C 310 270, 310 190, 380 190" fill="none" stroke="#34D399" stroke-width="2.5" class="flow-line" />

  <!-- Engine to Decision Branches -->
  <!-- Safe output branch -->
  <path d="M 580 160 C 650 160, 670 115, 730 115" fill="none" stroke="#10B981" stroke-width="2.5" class="flow-line" />
  <!-- Malicious output branch -->
  <path d="M 580 220 C 650 220, 670 265, 730 265" fill="none" stroke="#EF4444" stroke-width="2.5" class="threat-line" />

  <!-- Cloud Sync bi-directional line -->
  <path d="M 480 280 L 480 325" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="4,4" />

  <!-- LEFT COLUMN: Client Edge Ingress Points -->
  <g id="clients" transform="translate(40, 60)">
    <!-- Header -->
    <text x="0" y="-12" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1">1. ZERO-LATENCY INGRESS CLIENTS</text>

    <!-- Node 1: Web Interface -->
    <g transform="translate(0, 15)" filter="url(#shadow)">
      <rect width="190" height="60" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#0284C7" />
      <text x="28" y="34" fill="#FFFFFF" font-size="12" text-anchor="middle">🌐</text>
      <text x="52" y="27" fill="#F8FAFC" font-size="13" font-weight="700">Web App / Scanner</text>
      <text x="52" y="44" fill="#94A3B8" font-size="11">Next.js 16 + QR Engine</text>
      <circle cx="175" cy="30" r="4" fill="#38BDF8" />
    </g>

    <!-- Node 2: Extension -->
    <g transform="translate(0, 95)" filter="url(#shadow)">
      <rect width="190" height="60" rx="10" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#2563EB" />
      <text x="28" y="34" fill="#FFFFFF" font-size="12" text-anchor="middle">🧩</text>
      <text x="52" y="27" fill="#F8FAFC" font-size="13" font-weight="700">Chrome MV3 Ext</text>
      <text x="52" y="44" fill="#94A3B8" font-size="11">Pre-socket Interception</text>
      <circle cx="175" cy="30" r="4" fill="#60A5FA" />
    </g>

    <!-- Node 3: Android App -->
    <g transform="translate(0, 175)" filter="url(#shadow)">
      <rect width="190" height="60" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#059669" />
      <text x="28" y="34" fill="#FFFFFF" font-size="12" text-anchor="middle">📱</text>
      <text x="52" y="27" fill="#F8FAFC" font-size="13" font-weight="700">Android Link Shield</text>
      <text x="52" y="44" fill="#94A3B8" font-size="11">Intent Gatekeeper (SMS/WA)</text>
      <circle cx="175" cy="30" r="4" fill="#34D399" />
    </g>
  </g>

  <!-- CENTER: 24-Feature Hybrid Engine Core -->
  <g id="engine" transform="translate(380, 80)" filter="url(#shadow)">
    <!-- Header tag -->
    <text x="100" y="-12" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">2. ON-DEVICE HYBRID ML ENGINE</text>

    <!-- Core box -->
    <rect width="200" height="190" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="2" />
    
    <!-- Pulse badge inside -->
    <rect x="25" y="18" width="150" height="24" rx="6" fill="#312E81" stroke="#818CF8" stroke-width="1" class="badge-glow" />
    <text x="100" y="34" fill="#C7D2FE" font-size="10.5" font-weight="700" text-anchor="middle">⚡ &lt; 10ms Zero-Latency</text>

    <text x="100" y="66" fill="#F8FAFC" font-size="14" font-weight="800" text-anchor="middle">24 Feature Vectors</text>
    
    <!-- Mini Pills inside Core -->
    <g transform="translate(18, 78)">
      <rect width="164" height="20" rx="4" fill="#0F172A" />
      <text x="82" y="14" fill="#94A3B8" font-size="9.5" text-anchor="middle">📐 Shannon Entropy: H(X)</text>
    </g>
    <g transform="translate(18, 103)">
      <rect width="164" height="20" rx="4" fill="#0F172A" />
      <text x="82" y="14" fill="#94A3B8" font-size="9.5" text-anchor="middle">🔤 Punycode &amp; Homoglyph Scan</text>
    </g>
    <g transform="translate(18, 128)">
      <rect width="164" height="20" rx="4" fill="#0F172A" />
      <text x="82" y="14" fill="#94A3B8" font-size="9.5" text-anchor="middle">🎯 Brand Typosquat Matcher</text>
    </g>
    <g transform="translate(18, 153)">
      <rect width="164" height="20" rx="4" fill="#0F172A" />
      <text x="82" y="14" fill="#94A3B8" font-size="9.5" text-anchor="middle">🧠 PhiUSIIL ML Inference Weights</text>
    </g>

    <!-- Radar pulse indicator -->
    <circle cx="100" cy="95" r="8" fill="none" stroke="#818CF8" stroke-width="2" class="pulse-circle" />
  </g>

  <!-- BOTTOM CLOUD PERSISTENCE -->
  <g transform="translate(380, 328)">
    <rect width="200" height="34" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.2" />
    <text x="100" y="21" fill="#E9D5FF" font-size="11" font-weight="600" text-anchor="middle">☁️ MongoDB Atlas SecOps Telemetry</text>
  </g>

  <!-- RIGHT COLUMN: Enforcement Actions -->
  <g id="actions" transform="translate(730, 75)">
    <text x="0" y="-12" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1">3. ACTION POLICY MATRIX</text>

    <!-- SAFE TIER -->
    <g transform="translate(0, 15)" filter="url(#shadow)">
      <rect width="190" height="75" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <rect x="12" y="12" width="58" height="18" rx="4" fill="#064E3B" />
      <text x="41" y="24" fill="#6EE7B7" font-size="10" font-weight="800" text-anchor="middle">SAFE (80+)</text>
      <text x="76" y="25" fill="#34D399" font-size="12" font-weight="700">✓ Instant Pass</text>
      <text x="14" y="48" fill="#CBD5E1" font-size="11">Seamless Navigation</text>
      <text x="14" y="64" fill="#64748B" font-size="10">Zero user friction</text>
    </g>

    <!-- THREAT TIER -->
    <g transform="translate(0, 120)" filter="url(#shadow)">
      <rect width="190" height="95" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
      <rect x="12" y="12" width="78" height="18" rx="4" fill="#7F1D1D" />
      <text x="51" y="24" fill="#FCA5A5" font-size="10" font-weight="800" text-anchor="middle">THREAT (&lt;45)</text>
      <text x="96" y="25" fill="#F87171" font-size="12" font-weight="700">🛑 Hard Block</text>
      <text x="14" y="48" fill="#FCA5A5" font-size="11" font-weight="600">🔊 Hardware Audio Siren</text>
      <text x="14" y="65" fill="#CBD5E1" font-size="11">🔒 Scriptless Sandbox Preview</text>
      <text x="14" y="82" fill="#94A3B8" font-size="10">Auto SecOps Complaint Incident</text>
    </g>
  </g>
</svg>

