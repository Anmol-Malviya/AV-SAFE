<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <style>
      .step-pulse {
        animation: stepPulse 3s infinite ease-in-out;
      }
      .signal-beam {
        stroke-dasharray: 6, 6;
        animation: beamMove 1.5s linear infinite;
      }
      .alert-flash {
        animation: alertBlink 1.2s infinite alternate;
      }
      @keyframes beamMove {
        to { stroke-dashoffset: -24; }
      }
      @keyframes alertBlink {
        0% { fill: #EF4444; filter: drop-shadow(0 0 2px #EF4444); }
        100% { fill: #DC2626; filter: drop-shadow(0 0 10px #F87171); }
      }
      @keyframes stepPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <rect width="960" height="260" rx="16" fill="url(#shieldBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Connecting Beam between stages -->
  <line x1="160" y1="130" x2="800" y2="130" stroke="#475569" stroke-width="3" />
  <line x1="160" y1="130" x2="800" y2="130" stroke="#38BDF8" stroke-width="3" class="signal-beam" />

  <!-- Stage 1: URL Click in SMS/WhatsApp -->
  <g transform="translate(45, 60)">
    <rect width="150" height="135" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="75" cy="35" r="18" fill="#3B82F6" />
    <text x="75" y="41" fill="#FFFFFF" font-size="14" text-anchor="middle">📨</text>
    <text x="75" y="72" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">1. Malicious Link</text>
    <text x="75" y="90" fill="#94A3B8" font-size="10" text-anchor="middle">SMS / WA / Telegram</text>
    <rect x="25" y="102" width="100" height="20" rx="4" fill="#0F172A" />
    <text x="75" y="115" fill="#EF4444" font-size="9" text-anchor="middle">http://paypa1-sec.com</text>
  </g>

  <!-- Stage 2: Intent Filter Intercept -->
  <g transform="translate(230, 60)">
    <rect width="150" height="135" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="75" cy="35" r="18" fill="#0284C7" />
    <text x="75" y="41" fill="#FFFFFF" font-size="14" text-anchor="middle">⚡</text>
    <text x="75" y="72" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">2. Intent Gatekeeper</text>
    <text x="75" y="90" fill="#94A3B8" font-size="10" text-anchor="middle">Pre-browser Handler</text>
    <rect x="15" y="102" width="120" height="20" rx="4" fill="#0C4A6E" />
    <text x="75" y="115" fill="#7DD3FC" font-size="9" text-anchor="middle">android.intent.VIEW</text>
  </g>

  <!-- Stage 3: Instant On-Device Scoring -->
  <g transform="translate(415, 60)">
    <rect width="150" height="135" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.8" />
    <circle cx="75" cy="35" r="18" fill="#4F46E5" />
    <text x="75" y="41" fill="#FFFFFF" font-size="14" text-anchor="middle">🧠</text>
    <text x="75" y="72" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">3. Zero-Latency ML</text>
    <text x="75" y="90" fill="#94A3B8" font-size="10" text-anchor="middle">24-Vector Evaluator</text>
    <rect x="25" y="102" width="100" height="20" rx="4" fill="#312E81" />
    <text x="75" y="115" fill="#C7D2FE" font-size="9.5" font-weight="700" text-anchor="middle">Score: 12 / 100 🛑</text>
  </g>

  <!-- Stage 4: Hardware Alert Siren -->
  <g transform="translate(600, 60)">
    <rect width="150" height="135" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    <circle cx="75" cy="35" r="18" fill="#D97706" />
    <text x="75" y="41" fill="#FFFFFF" font-size="14" text-anchor="middle">🔊</text>
    <text x="75" y="72" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">4. Hardware Siren</text>
    <text x="75" y="90" fill="#94A3B8" font-size="10" text-anchor="middle">Audio &amp; Haptic Warning</text>
    <rect x="20" y="102" width="110" height="20" rx="4" fill="#451A03" />
    <text x="75" y="115" fill="#FDE68A" font-size="9" text-anchor="middle">audiomass alarm tone</text>
  </g>

  <!-- Stage 5: Isolated Safe Sandbox -->
  <g transform="translate(775, 55)">
    <rect width="145" height="145" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2.2" />
    <circle cx="72" cy="35" r="20" fill="#DC2626" class="alert-flash" />
    <text x="72" y="42" fill="#FFFFFF" font-size="15" text-anchor="middle">🛡️</text>
    <text x="72" y="74" fill="#FCA5A5" font-size="12" font-weight="800" text-anchor="middle">5. Link Blocked</text>
    <text x="72" y="92" fill="#CBD5E1" font-size="9.5" text-anchor="middle">Safe Sandbox Option</text>
    <rect x="15" y="106" width="115" height="24" rx="6" fill="#7F1D1D" />
    <text x="72" y="122" fill="#FEE2E2" font-size="9.5" font-weight="700" text-anchor="middle">Steal Prevention 100%</text>
  </g>

  <!-- Title bar -->
  <text x="480" y="32" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">
    REAL-TIME ANDROID INTENT SHIELD &amp; INTERCEPTION LIFECYCLE
  </text>
</svg>

