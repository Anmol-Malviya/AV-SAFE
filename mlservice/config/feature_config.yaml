# AV-SAFE Feature Configuration

# Exact 24 URL-only runtime features required by AV-SAFE runtime engines (JS & Kotlin)
runtime_features_24:
  - url_length
  - domain_length
  - is_ip
  - tld_length
  - subdomain_count
  - is_https
  - letters
  - letter_ratio
  - digits
  - digit_ratio
  - special
  - special_ratio
  - equals_count
  - qmark_count
  - amp_count
  - hyphen_count
  - dots_count
  - slash_count
  - shannon_entropy
  - sensitive_words_count
  - is_shortened
  - is_suspicious_tld
  - is_typosquatting
  - brand_abuse_triggered

# Extended URL features available in PhiUSIIL
phiusiil_url_features:
  - URLLength
  - DomainLength
  - IsDomainIP
  - TLDLength
  - NoOfSubDomain
  - IsHTTPS
  - NoOfLettersInURL
  - LetterRatioInURL
  - NoOfDegitsInURL
  - DegitRatioInURL
  - NoOfEqualsInURL
  - NoOfQMarkInURL
  - NoOfAmpersandInURL
  - NoOfOtherSpecialCharsInURL
  - SpacialCharRatioInURL
  - CharContinuationRate
  - URLSimilarityIndex
  - TLDLegitimateProb
  - URLCharProb
  - HasObfuscation
  - NoOfObfuscatedChar
  - ObfuscationRatio

# Website-dependent features (Separated, not used in offline URL-only engine)
website_dependent_features:
  - LineOfCode
  - LargestLineLength
  - HasTitle
  - DomainTitleMatchScore
  - URLTitleMatchScore
  - HasFavicon
  - Robots
  - IsResponsive
  - NoOfURLRedirect
  - NoOfSelfRedirect
  - HasDescription
  - NoOfPopup
  - NoOfiFrame
  - HasExternalFormSubmit
  - HasSocialNet
  - HasSubmitButton
  - HasHiddenFields
  - HasPasswordField
  - Bank
  - Pay
  - Crypto
  - HasCopyrightInfo
  - NoOfImage
  - NoOfCSS
  - NoOfJS
  - NoOfSelfRef
  - NoOfEmptyRef
  - NoOfExternalRef

